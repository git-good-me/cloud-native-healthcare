healthcare_dbt:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: us-east-1
      s3_staging_dir: s3://cloud-native-healthcare-gold/athena-results/
      s3_data_dir: s3://cloud-native-healthcare-gold/dbt/
      database: awsdatacatalog
      schema: healthcare_lakehouse
      aws_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
      aws_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
      threads: 4
      work_group: primary